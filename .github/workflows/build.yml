name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - uses: android-actions/setup-android@v3

    - name: Setup project
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/swf/game
        cp *.swf app/src/main/assets/game.swf

        cd app/src/main/assets
        wget -O ruffle.js https://unpkg.com/@ruffle-rs/ruffle/ruffle.js
        cd ../../..

    - name: HTML
      run: |
        cat > app/src/main/assets/index.html << 'EOF'
        <html>
        <body style="margin:0;background:black">
        <script src="ruffle.js"></script>
        <script>
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        player.style.width="100vw";
        player.style.height="100vh";
        document.body.appendChild(player);
        player.load("game.swf");
        </script>
        </body>
        </html>
        EOF

    - name: Java
      run: |
        cat > app/src/main/java/com/swf/game/MainActivity.java << 'EOF'
        package com.swf.game;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;

        public class MainActivity extends Activity {
            protected void onCreate(Bundle b) {
                super.onCreate(b);
                WebView w = new WebView(this);
                w.getSettings().setJavaScriptEnabled(true);
                w.loadUrl("file:///android_asset/index.html");
                setContentView(w);
            }
        }
        EOF

    - name: Manifest
      run: |
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
        <application android:label="SWF Game">
        <activity android:name=".MainActivity" android:exported="true">
        <intent-filter>
        <action android:name="android.intent.action.MAIN"/>
        <category android:name="android.intent.category.LAUNCHER"/>
        </intent-filter>
        </activity>
        </application>
        </manifest>
        EOF

    - name: Gradle
      run: |
        cat > build.gradle << 'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:7.4.2' }
        }
        allprojects {
            repositories { google(); mavenCentral() }
        }
        EOF

        cat > settings.gradle << 'EOF'
        include ':app'
        EOF

        cat > app/build.gradle << 'EOF'
        plugins { id 'com.android.application' }

        android {
            namespace 'com.swf.game'
            compileSdk 33

            defaultConfig {
                applicationId "com.swf.game"
                minSdk 21
                targetSdk 33
            }
        }
        EOF

    - name: Wrapper
      run: gradle wrapper --gradle-version 7.5

    - name: Build
      run: ./gradlew assembleRelease

    - uses: actions/upload-artifact@v4
      with:
        name: apk
        path: app/build/outputs/apk/release/app-release.apk
